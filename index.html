<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website with Mini-Me</title>
  <style>
    /* Add your standard website styles here */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 40px;
      background: #f4f4f9;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- Your normal website content goes here -->
  <main>
    <h1>Welcome to My Website</h1>
    <p>This is my regular webpage content. The animated pet and chat widget will float on top of this page automatically.</p>
  </main>

  <!-- 1. Include the widget script -->
  <script src="mini-me-widget.js"></script>

  <!-- 2. Drop the widget tag anywhere (recommended right before </body>) -->
  <mini-me-widget api-base="https://mini-me-backend-ue1z.onrender.com"></mini-me-widget>

</body>
</html>
